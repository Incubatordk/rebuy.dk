<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Security headers via meta (GitHub Pages sends no response headers). CSP
       allow-list = Google Fonts, Umami analytics, Appwrite (form POSTs). Note:
       X-Content-Type-Options and frame-ancestors need real response headers —
       out of scope for a meta-only fix. See issue #108. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://umami.robert-jensen.dk; connect-src 'self' https://base.anchorit.dk https://umami.robert-jensen.dk; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Log ind — Rebuy</title>
  <meta name="description" content="Åbn Rebuy-appen for at logge ind.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png">
  <meta name="theme-color" content="#FAFAF9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .magic { max-width: 520px; margin: 0 auto; padding: var(--space-3xl) var(--space-lg); text-align: center; }
    .magic h1 { font-size: var(--text-2xl); margin-bottom: var(--space-md); }
    .magic p { color: var(--color-text-secondary); line-height: 1.6; margin-bottom: var(--space-md); }
    .magic-icon { font-size: 64px; margin-bottom: var(--space-lg); }
  </style>
</head>
<body>
  <main class="magic">
    <div class="magic-icon" aria-hidden="true">✉️</div>
    <h1>Åbn Rebuy-appen</h1>
    <p>
      Dette link er ment til at åbne Rebuy-appen på din telefon og logge dig ind automatisk.
    </p>
    <p>
      <strong>Har du ikke installeret appen?</strong><br>
      Installér Rebuy fra App Store og tryk derefter på linket igen fra din e-mail.
    </p>
    <p>
      <a href="/">Tilbage til forsiden</a>
    </p>
  </main>
</body>
</html>
