name: Check generated files

# llms.txt / llms-full.txt are generated by scripts/build-llms.js but are also
# committed (so the served content is right outside a deploy, and so content
# drift shows up in review). Nothing enforced that the committed copies still
# match the generator — which is exactly the drift that produced issue #93,
# where the hand-written files told every AI assistant to "join the waiting
# list" months after launch.
#
# This runs on pull requests rather than in deploy.yml on purpose: it catches
# drift *before* it reaches main, and a stale committed file can never take the
# production deploy down with it (deploy.yml regenerates the files anyway, so
# what ships is always correct regardless).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate llms.txt + llms-full.txt
        run: node scripts/build-llms.js
      # llms-full.txt embeds a "Generated: <today>" line, so the committed copy
      # legitimately differs from a fresh run on any later date. Ignore that one
      # line (-I) — otherwise this check would start failing a day after every
      # merge, for a difference that means nothing.
      - name: Fail if the committed files have drifted
        run: |
          if ! git diff --exit-code -I'^This file contains the full text of Rebuy' -- llms.txt llms-full.txt; then
            echo ""
            echo "::error::llms.txt / llms-full.txt are out of date with scripts/build-llms.js."
            echo "Run 'make llms' and commit the result."
            exit 1
          fi
          echo "llms.txt and llms-full.txt match the generator."
